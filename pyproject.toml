[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "szl-guardrail-receipt"
version = "0.1.0"
description = "Thin, dependency-light adapter that wraps any LLM guardrail verdict (Llama-Guard / NeMo-Guardrails / guardrails-ai / your own callable) and emits a signed, hash-chained DSSE decision receipt aligned with SZL's governed-receipt-spec. UNSIGNED-honest fallback; never fabricates a signature, an energy joule, or a Λ 'proven'."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "SZL Contributors" }]
keywords = [
    "guardrails",
    "llm-safety",
    "dsse",
    "receipt",
    "provenance",
    "governance",
    "audit-trail",
    "jailbreak-detection",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# Real ECDSA-P256-SHA256 DSSE signatures (cosign-compatible). Without this the
# package still emits verifiable UNSIGNED-honest receipts.
sign = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-guardrail-receipt"
Spec = "https://github.com/szl-holdings/governed-receipt-spec"
Demo = "https://huggingface.co/spaces/SZLHOLDINGS/guardrail-receipt"

[project.scripts]
szl-guardrail-receipt = "szl_guardrail_receipt.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/szl_guardrail_receipt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

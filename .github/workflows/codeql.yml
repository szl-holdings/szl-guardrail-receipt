name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '10 4 * * 1'  # weekly, Monday 04:10 UTC
permissions:
  contents: read
jobs:
  analyze:
    # Org reusable workflow, SHA-pinned per pin-check.yml (szl-holdings/.github@main as of 2026-09-25).
    uses: szl-holdings/.github/.github/workflows/reusable-codeql.yml@81bffda96e1a906397b9a921f0ff65df80f14cae
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python"]'

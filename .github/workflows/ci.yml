name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: lint (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Byte-compile all sources
        run: python -m compileall -q src tests examples

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  spec-compat:
    name: cross-verify against governed-receipt-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install package (with signing)
        run: pip install -e ".[sign]"
      - name: Emit a fresh signed receipt chain
        run: python examples/generate.py --out /tmp/chain.json
      - name: Clone the governed-receipt-spec verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: szl-holdings/governed-receipt-spec
          path: governed-receipt-spec
      - name: Validate emitted receipts with the spec's offline verifier
        run: |
          python governed-receipt-spec/verify.py /tmp/chain.json \
            --schema governed-receipt-spec/schema/governed-receipt.schema.json

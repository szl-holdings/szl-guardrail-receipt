name: publish to PyPI

# Trusted Publishing (OIDC) — no long-lived PyPI token stored anywhere.
# One-time setup (owner, on pypi.org -> Publishing -> Add a pending publisher):
#   PyPI project name: <the package name>
#   Owner:             szl-holdings
#   Repository name:   <this repo>
#   Workflow name:     publish-pypi.yml
#   Environment name:  pypi
# First run creates the project; later runs publish new versions.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build-dists:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir dist/
          # Checksums are provenance only; keep them OUT of the published dist
          # dir (gh-action-pypi-publish rejects non-distribution files).
          sha256sum dist/*.whl dist/*.tar.gz | tee CHECKSUMS.txt
      - name: Upload dist artifact (publishable files only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Upload checksums (provenance only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-checksums
          path: CHECKSUMS.txt
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publisher)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-dists
    environment:
      name: pypi
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: read
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: pypi-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
